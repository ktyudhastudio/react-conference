name: react-conference

services:
  web:
    build: .
    restart: unless-stopped
    environment:
      # alamat go-conference dari dalam container (host server yang sama)
      API_UPSTREAM: ${API_UPSTREAM:-http://host.docker.internal:2992}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${WEB_PORT:-8081}:80"
